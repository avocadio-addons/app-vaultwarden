---
name: Vaultwarden
version: 0.27.0.1
slug: vaultwarden
description: Open source password management solution
url: https://github.com/avocadio-addons/app-vaultwarden
image: ghcr.io/avocadio-addons/vaultwarden
webui: "[PROTO:ssl]://[HOST]:[PORT:7277]"
init: false
arch:
  - aarch64
  - amd64
ports:
  7277/tcp: 7277
ports_description:
  7277/tcp: Vaultwarden Web interface
map:
  - ssl
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  request_size_limit: int?
